<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Somik World v0.1</title>
<style>
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif}
.app{display:grid;grid-template-columns:1fr 260px;min-height:100vh}
main{padding:16px}
aside{background:#1f2937;padding:16px}
canvas{display:block;background:#4b9b4f;border:2px solid #374151;max-width:100%}
button{padding:8px 12px;margin:4px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #374151}
.small{font-size:13px;color:#cbd5e1;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<main>
<h1>Somik World v0.1</h1>
<div>
<button id="pause">⏸ עצור</button>
<button id="reset">↻ התחל מחדש</button>
<button id="speed">⚡ x1</button>
</div>
<canvas id="c" width="900" height="620"></canvas>
</main>
<aside>
<h2>מצב העולם</h2>
<div class="row"><span>Somik-ים</span><b id="pop">0</b></div>
<div class="row"><span>אוכל</span><b id="food">0</b></div>
<div class="row"><span>לידות</span><b id="births">0</b></div>
<div class="row"><span>מוות</span><b id="deaths">0</b></div>
<div class="row"><span>Ticks</span><b id="ticks">0</b></div>
<p class="small">גרסת בסיס: Somik-ים זזים, צורכים אנרגיה, אוכלים, מתים ומתרבים. עדיין אין מוח אמיתי ואין בנייה.</p>
</aside>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
let somiks=[],foods=[],running=true,speed=1,ticks=0,births=0,deaths=0;
const cols=['#60a5fa','#f59e0b','#a78bfa','#34d399','#f472b6','#facc15'];
const rnd=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

class Somik{
  constructor(x=rnd(20,W-20),y=rnd(20,H-20),gen=0){
    this.x=x;this.y=y;this.r=9;this.dir=rnd(0,Math.PI*2);
    this.energy=100;this.age=0;this.gen=gen;
    this.color=cols[Math.floor(Math.random()*cols.length)];
    this.turnBias=rnd(-0.06,0.06);
  }
  update(){
    this.age++;
    this.energy-=0.05;
    this.dir+=this.turnBias+rnd(-0.11,0.11);
    this.x+=Math.cos(this.dir)*1.15;
    this.y+=Math.sin(this.dir)*1.15;
    if(this.x<this.r||this.x>W-this.r)this.dir=Math.PI-this.dir;
    if(this.y<this.r||this.y>H-this.r)this.dir=-this.dir;
    this.x=clamp(this.x,this.r,W-this.r);
    this.y=clamp(this.y,this.r,H-this.r);

    for(let i=foods.length-1;i>=0;i--){
      const f=foods[i],dx=this.x-f.x,dy=this.y-f.y;
      if(dx*dx+dy*dy<(this.r+f.r)*(this.r+f.r)){
        this.energy=Math.min(180,this.energy+35);
        foods.splice(i,1);
      }
    }

    if(this.energy>150 && Math.random()<0.00045){
      this.energy-=55;
      const child=new Somik(this.x+rnd(-12,12),this.y+rnd(-12,12),this.gen+1);
      child.turnBias=this.turnBias+rnd(-0.012,0.012);
      somiks.push(child);births++;
    }
  }
  draw(){
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=this.color;ctx.fill();ctx.strokeStyle='#111827';ctx.lineWidth=2;ctx.stroke();
    const ex=Math.cos(this.dir)*5,ey=Math.sin(this.dir)*5;
    ctx.fillStyle='white';
    ctx.beginPath();ctx.arc(this.x+ex-ey*.35,this.y+ey+ex*.35,2.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(this.x+ex+ey*.35,this.y+ey-ex*.35,2.1,0,Math.PI*2);ctx.fill();
  }
}

function addFood(n){
  for(let i=0;i<n;i++)foods.push({x:rnd(15,W-15),y:rnd(15,H-15),r:5});
}
function reset(){
  somiks=[];foods=[];ticks=0;births=0;deaths=0;
  for(let i=0;i<20;i++)somiks.push(new Somik());
  addFood(100);
}
function update(){
  ticks++;
  for(const s of somiks)s.update();
  const alive=[];
  for(const s of somiks){
    if(s.energy>0&&s.age<12000)alive.push(s);else deaths++;
  }
  somiks=alive;
  if(foods.length<100&&Math.random()<0.09)addFood(1);
  if(somiks.length===0){for(let i=0;i<20;i++)somiks.push(new Somik());}
}
function bg(){
  ctx.fillStyle='#4b9b4f';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,0,0,.08)';
  for(let x=0;x<W;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function draw(){
  bg();
  for(const f of foods){
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle='#ef4444';ctx.fill();ctx.strokeStyle='#7f1d1d';ctx.stroke();
  }
  for(const s of somiks)s.draw();
  pop.textContent=somiks.length;food.textContent=foods.length;
  document.getElementById('births').textContent=births;
  document.getElementById('deaths').textContent=deaths;
  document.getElementById('ticks').textContent=ticks;
}
function loop(){
  if(running)for(let i=0;i<speed;i++)update();
  draw();requestAnimationFrame(loop);
}
pause.onclick=()=>{running=!running;pause.textContent=running?'⏸ עצור':'▶ המשך'};
document.getElementById('reset').onclick=reset;
document.getElementById('speed').onclick=()=>{
  speed=speed===1?5:speed===5?20:1;
  document.getElementById('speed').textContent='⚡ x'+speed;
};
reset();loop();
</script>
</body>
</html>
